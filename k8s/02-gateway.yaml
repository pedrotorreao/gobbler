# ==============================================================================
# Gobbler Ingestion Gateway: Deployment & Service Manifest
# ==============================================================================
# This manifest orchestrates the low-latency TCP Ingestion Gateway and its
# accompanying ingress routing abstraction.
#
# Architectural Characteristics:
#   1. Ingress Gateway vs. Pure Worker Pattern:
#      - Unlike the Consumer and Persister (which are pure background workers
#        pulling data from Kafka without needing incoming network traffic), the
#        Gateway is a server accepting external client connections.
#      - It requires both a Deployment (to manage Pod replicas) and a Service
#        (to provide a stable network endpoint and port exposure).
#
#   2. End-to-End Ingress Networking Flow:
#      - Traffic path for exchange ticks:
#          Host Generator (127.0.0.1:8008)
#            ├──> Kind Control-Plane extraPortMappings (Host 8008 -> NodePort 30008)
#            ├──> Kubernetes NodePort Service (NodePort 30008 -> ClusterIP 8008)
#            └──> Gateway Pod (containerPort 8008 -> Accept() Loop -> Kafka Producer)
#      - Traffic path for diagnostic profiling:
#          Host Browser / curl (127.0.0.1:6060)
#            ├──> Kind extraPortMappings (Host 6060 -> NodePort 30060)
#            └──> Gateway Pod (net/http/pprof on 6060)
#
#   3. Minimal Scratch Container & Resource Footprint:
#      - Runs static Go binary on 'scratch' (~8.09 MB) as unprivileged appuser.
#      - Minimal resource allocation (50m CPU / 32Mi RAM request) with headroom
#        for high-frequency bursts (250m CPU / 64Mi RAM limit).
# ==============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: gobbler-gateway
  namespace: gobbler
  labels:
    app: gobbler-gateway
    tier: ingestion
    app.kubernetes.io/name: gobbler-gateway
    app.kubernetes.io/part-of: gobbler-surveillance-platform
spec:
  # Single active ingestion listener instance
  replicas: 1

  # Deployment Controller selector: identifies managed Pods by label
  selector:
    matchLabels:
      app: gobbler-gateway

  # Pod Template: Defines the specification for newly scheduled Pods
  template:
    metadata:
      labels:
        app: gobbler-gateway
        tier: ingestion
    spec:
      containers:
        - name: gateway
          image: gobbler-gateway:latest

          # Crucial for local Kind: forces containerd to use the sideloaded image
          # from the local cache rather than failing attempting to pull from Docker Hub
          imagePullPolicy: IfNotPresent

          ports:
            # High-throughput TCP tick ingestion port
            - name: tcp-ingress
              containerPort: 8008

            # Diagnostic Go runtime pprof profiling port
            - name: http-pprof
              containerPort: 6060

          # Centralized configuration injection (KAFKA_BROKER, INGESTION_GATEWAY_ADDR, etc.)
          envFrom:
            - configMapRef:
                name: gobbler-config

          # Resource Management:
          #   - requests: Baseline allocation reserved by the Kubernetes scheduler.
          #   - limits: Hard ceiling enforced by Linux cgroups.
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "250m"
              memory: "64Mi"

---
# ==============================================================================
# Gobbler Ingestion Gateway: NodePort Service
# ==============================================================================
# Exposes the Gateway Pods outside the Kind cluster network by opening static
# ports (NodePort 30008 & 30060) across all Kind cluster nodes.
# Combined with kind-config.yaml extraPortMappings, this enables external host
# processes (like the synthetic generator or curl) to connect seamlessly.
# ==============================================================================

apiVersion: v1
kind: Service
metadata:
  name: gobbler-gateway
  namespace: gobbler
  labels:
    app: gobbler-gateway
    tier: ingestion
    app.kubernetes.io/name: gobbler-gateway
    app.kubernetes.io/part-of: gobbler-surveillance-platform
spec:
  type: NodePort

  # Routes traffic to Pods matching this selector
  selector:
    app: gobbler-gateway

  ports:
    # Ingestion Gateway TCP Traffic:
    # Host 8008 -> Kind NodePort 30008 -> Service ClusterIP 8008 -> Pod containerPort 8008
    - name: tcp-ingress
      port: 8008
      targetPort: 8008
      nodePort: 30008
      protocol: TCP

    # HTTP pprof Profiling:
    # Host 6060 -> Kind NodePort 30060 -> Service ClusterIP 6060 -> Pod containerPort 6060
    - name: http-pprof
      port: 6060
      targetPort: 6060
      nodePort: 30060
      protocol: TCP

